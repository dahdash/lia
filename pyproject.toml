[project]
name = "lia"
version = "0.1.0"
description = "Lia: a Persian assistant that deploys, monitors and troubleshoots websites on Liara"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
lia = "lia.web.server:main"
lia-mcp = "lia.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lia*"]

[tool.setuptools.package-data]
"lia.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
